<!DOCTYPE html>
<html>
<head>
    <title>Ai Gaza Stories</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script src="template.js"></script>
    <script>
        loadTemplate("AI Gaza Stories", `
		<div class="container">
		    <p>This website presents a dataset of 52 stories and conversations generated mainly through ChatGPT and DeepSeek (and very occasionally, Grok) about perspectives on Gaza in June-August 2025. The record on Gaza and the AI mediations captured in this dataset are of an international conjuncture rather than for a regional focal point.</p>
		    <p>This is how the elicitation worked. The Prompter requests a story on Gaza, and the Large Language Model (LLM) generates one accordingly. Then the Prompter asks the LLM to answer questions about that story. The story and the consequent conversation is posted in a single PDF file on this website. Then the Prompter requests another story… and so on.</p>
		    <p>There are three kinds of AI stories on Gaza, featured in three pages accessible from the menu. These are about: <a href="/conditions.html">Current Conditions</a>, <a href="/leaders.html">Leaders’ Perspectives</a>, <a href="workers.html">Workers’ Perspectives</a>. The opening prompt determines which category a story belongs to. There is also a <a href="notes.html">Notes</a> page, where the Prompter occasionally posts observations and where readers are invited to post comments.</p>
		    <p>In each PDF file, the prompts appear in red fonts, the LLM-generated story in black fonts, the LLM's conversational responses to prompts in blue fonts. The date of each story is noted at the beginning.</p>
		    <p>All the material on this website is in the public domain as <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0 Universal</a>. When using or reusing material, a reference of link to this website or to its <a href="https://aigazastories.wordpress.com/">twin website</a> is desirable but not essential.</p>
		</div> 
	`);
    </script>
</body>
</html>
